<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Gateway — Onboarding Flow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;display:flex;justify-content:center;padding:24px}
.wrap{width:100%;max-width:1200px}
h1{font-size:20px;font-weight:600;color:#e6edf3;margin-bottom:4px;text-align:center}
.sub{text-align:center;color:#8b949e;font-size:13px;margin-bottom:16px}
svg{width:100%;height:auto;display:block}
.mono{font-family:'SF Mono',Menlo,Monaco,monospace}
</style>
</head>
<body>
<div class="wrap">
<h1>AI Gateway — API Key Onboarding Flow</h1>
<p class="sub">How teams get access to the AI Gateway via AI Budget Help (future: Atlas)</p>

<svg viewBox="0 0 1100 680" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="ah-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#58a6ff" stroke-width="1.2"/></marker>
  <marker id="ah-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#3fb950" stroke-width="1.2"/></marker>
  <marker id="ah-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#bc8cff" stroke-width="1.2"/></marker>
  <marker id="ah-teal" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#39d2c0" stroke-width="1.2"/></marker>
  <marker id="ah-amber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#d29922" stroke-width="1.2"/></marker>
  <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/></filter>
</defs>

<!-- ═══════════════════════════════════════════
     STEP 1 — AI Budget Help (external caller)
     ═══════════════════════════════════════════ -->
<rect x="60" y="20" width="280" height="75" rx="8" fill="#1c1340" stroke="#8957e5" stroke-width="2" filter="url(#shadow)"/>
<text x="200" y="40" text-anchor="middle" fill="#8957e5" font-size="9" font-weight="600" letter-spacing="0.5">EXTERNAL SERVICE</text>
<text x="200" y="58" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="700">AI Budget Help</text>
<text x="200" y="72" text-anchor="middle" fill="#8b949e" font-size="9">Budget approval + team provisioning</text>
<text x="200" y="84" text-anchor="middle" fill="#6e7681" font-size="8" font-style="italic">Future: replaced by Atlas</text>

<!-- step label -->
<rect x="60" y="8" width="16" height="16" rx="8" fill="#8957e5"/>
<text x="68" y="19" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">1</text>
<text x="82" y="19" fill="#8957e5" font-size="9" font-weight="600">Team approved → create API key</text>

<!-- ═══════════════════════════════════════════
     ARROW: AI Budget Help → maas-api (POST request)
     ═══════════════════════════════════════════ -->
<path d="M200,95 L200,155" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#ah-blue)"/>

<!-- step label -->
<rect x="60" y="110" width="16" height="16" rx="8" fill="#58a6ff"/>
<text x="68" y="121" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">2</text>
<text x="82" y="121" fill="#58a6ff" font-size="9" font-weight="600">POST /v1/api-keys (offline token + NetworkPolicy restricted)</text>

<!-- ═══════════════════════════════════════════
     REQUEST PAYLOAD (left of arrow)
     ═══════════════════════════════════════════ -->
<rect x="370" y="20" width="340" height="155" rx="6" fill="#0d1a2a" stroke="#58a6ff" stroke-width="1" filter="url(#shadow)"/>
<text x="540" y="38" text-anchor="middle" fill="#58a6ff" font-size="9" font-weight="600">REQUEST</text>
<text x="540" y="52" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">POST /v1/api-keys</text>

<!-- headers -->
<text x="385" y="70" fill="#d29922" font-size="8" font-weight="600">HEADERS</text>
<text x="385" y="82" fill="#8b949e" font-size="8" class="mono">Authorization: Bearer &lt;offline-token&gt;</text>
<text x="385" y="93" fill="#8b949e" font-size="8" class="mono">X-MaaS-Username: user@example.com</text>
<text x="385" y="104" fill="#8b949e" font-size="8" class="mono">X-MaaS-Group: ["team-a","platform"]</text>

<!-- body -->
<text x="385" y="121" fill="#d29922" font-size="8" font-weight="600">BODY</text>
<text x="385" y="133" fill="#3fb950" font-size="8" class="mono">{</text>
<text x="395" y="143" fill="#8b949e" font-size="8" class="mono">"name": "jdoe-claude-code",</text>
<text x="395" y="153" fill="#8b949e" font-size="8" class="mono">"description": "Claude Code access",</text>
<text x="395" y="163" fill="#8b949e" font-size="8" class="mono">"labels": {"team": "team-a"}</text>
<text x="385" y="173" fill="#3fb950" font-size="8" class="mono">}</text>

<!-- arrow from request box to the flow -->
<path d="M370,90 L220,90" fill="none" stroke="#58a6ff" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>

<!-- ═══════════════════════════════════════════
     OPTIONAL FIELDS (right side)
     ═══════════════════════════════════════════ -->
<rect x="730" y="20" width="310" height="138" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="885" y="38" text-anchor="middle" fill="#6e7681" font-size="9" font-weight="600">OPTIONAL FIELDS</text>

<text x="745" y="56" fill="#8b949e" font-size="8" class="mono">"subscription": "sub-name"</text>
<text x="745" y="68" fill="#6e7681" font-size="7">MaaSSubscription name; auto-resolved if omitted</text>

<text x="745" y="86" fill="#8b949e" font-size="8" class="mono">"expiresIn": "720h"</text>
<text x="745" y="98" fill="#6e7681" font-size="7">Duration string; defaults to API_KEY_MAX_EXPIRATION_DAYS</text>

<text x="745" y="116" fill="#8b949e" font-size="8" class="mono">"ephemeral": false</text>
<text x="745" y="128" fill="#6e7681" font-size="7">Short-lived programmatic key (default false)</text>

<text x="745" y="146" fill="#8b949e" font-size="8" class="mono">"labels": {"team": "..."}</text>
<text x="745" y="158" fill="#6e7681" font-size="7">Structured metadata (map[string]string)</text>

<!-- ═══════════════════════════════════════════
     maas-api (receives the call)
     ═══════════════════════════════════════════ -->
<rect x="60" y="160" width="280" height="70" rx="8" fill="#1c1340" stroke="#8957e5" stroke-width="2" filter="url(#shadow)"/>
<text x="200" y="180" text-anchor="middle" fill="#8957e5" font-size="9" font-weight="600">AUTH SERVICE · ai-gateway</text>
<text x="200" y="197" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="700">maas-api</text>
<text x="200" y="212" text-anchor="middle" fill="#8b949e" font-size="9">:8080 · strictAuthMiddleware</text>
<text x="200" y="224" text-anchor="middle" fill="#6e7681" font-size="8">Rejects API key auth — identity headers only</text>

<!-- ═══════════════════════════════════════════
     ARROW: maas-api → DB (store key hash)
     ═══════════════════════════════════════════ -->
<path d="M200,230 L200,290" fill="none" stroke="#39d2c0" stroke-width="2" marker-end="url(#ah-teal)"/>

<!-- step label -->
<rect x="60" y="248" width="16" height="16" rx="8" fill="#39d2c0"/>
<text x="68" y="259" text-anchor="middle" fill="#0d1117" font-size="9" font-weight="700">3</text>
<text x="82" y="259" fill="#39d2c0" font-size="9" font-weight="600">Hash key → store in DB (plaintext never persisted)</text>

<!-- ═══════════════════════════════════════════
     PostgreSQL (RDS)
     ═══════════════════════════════════════════ -->
<rect x="60" y="295" width="280" height="55" rx="8" fill="#0d2626" stroke="#39d2c0" stroke-width="2" filter="url(#shadow)"/>
<ellipse cx="92" cy="316" rx="12" ry="5" fill="none" stroke="#39d2c0" stroke-width="1"/>
<path d="M80,316 L80,332 Q80,338 92,338 Q104,338 104,332 L104,316" fill="none" stroke="#39d2c0" stroke-width="1"/>
<text x="230" y="314" text-anchor="middle" fill="#39d2c0" font-size="9" font-weight="600">DATABASE</text>
<text x="230" y="330" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">Amazon RDS · PostgreSQL</text>
<text x="230" y="343" text-anchor="middle" fill="#8b949e" font-size="8">api_keys table: id, key_hash, prefix, name, user, group, expires_at</text>

<!-- ═══════════════════════════════════════════
     ARROW: maas-api → response (back to caller)
     ═══════════════════════════════════════════ -->
<path d="M340,195 L460,195" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#ah-green)"/>

<!-- step label -->
<rect x="370" y="178" width="16" height="16" rx="8" fill="#3fb950"/>
<text x="378" y="189" text-anchor="middle" fill="#0d1117" font-size="9" font-weight="700">4</text>
<text x="392" y="189" fill="#3fb950" font-size="9" font-weight="600">HTTP 201 — key returned (shown once, never stored)</text>

<!-- ═══════════════════════════════════════════
     RESPONSE PAYLOAD
     ═══════════════════════════════════════════ -->
<rect x="462" y="168" width="345" height="175" rx="6" fill="#0d261a" stroke="#3fb950" stroke-width="1" filter="url(#shadow)"/>
<text x="634" y="186" text-anchor="middle" fill="#3fb950" font-size="9" font-weight="600">RESPONSE · HTTP 201</text>

<text x="477" y="202" fill="#3fb950" font-size="8" class="mono">{</text>
<text x="487" y="213" fill="#e6edf3" font-size="8" class="mono">"key": "sk-oai-abc123...",</text>
<text x="660" y="213" fill="#d29922" font-size="7">← SHOWN ONCE</text>
<text x="487" y="224" fill="#8b949e" font-size="8" class="mono">"keyPrefix": "sk-oai-abc1",</text>
<text x="487" y="235" fill="#8b949e" font-size="8" class="mono">"id": "550e8400-e29b-...",</text>
<text x="487" y="246" fill="#8b949e" font-size="8" class="mono">"name": "jdoe-claude-code",</text>
<text x="487" y="257" fill="#8b949e" font-size="8" class="mono">"subscription": "team-a-sub",</text>
<text x="487" y="268" fill="#8b949e" font-size="8" class="mono">"createdAt": "2026-09-23T10:00:00Z",</text>
<text x="487" y="279" fill="#8b949e" font-size="8" class="mono">"expiresAt": "2026-12-22T10:00:00Z",</text>
<text x="487" y="290" fill="#8b949e" font-size="8" class="mono">"ephemeral": false,</text>
<text x="487" y="301" fill="#8b949e" font-size="8" class="mono">"labels": {"team": "team-a"}</text>
<text x="477" y="312" fill="#3fb950" font-size="8" class="mono">}</text>

<!-- ═══════════════════════════════════════════
     ARROW: response → AI Budget Help (key delivered to user)
     ═══════════════════════════════════════════ -->
<path d="M634,343 L634,398" fill="none" stroke="#d29922" stroke-width="2" marker-end="url(#ah-amber)"/>

<!-- step label -->
<rect x="565" y="362" width="16" height="16" rx="8" fill="#d29922"/>
<text x="573" y="373" text-anchor="middle" fill="#0d1117" font-size="9" font-weight="700">5</text>
<text x="587" y="373" fill="#d29922" font-size="9" font-weight="600">Key + gateway URLs delivered to user</text>

<!-- ═══════════════════════════════════════════
     USER receives key
     ═══════════════════════════════════════════ -->
<rect x="462" y="400" width="345" height="55" rx="8" fill="#1a3050" stroke="#58a6ff" stroke-width="1.5" filter="url(#shadow)"/>
<text x="634" y="420" text-anchor="middle" fill="#58a6ff" font-size="9" font-weight="600">ENGINEER</text>
<text x="634" y="436" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">user@example.com</text>
<text x="634" y="448" text-anchor="middle" fill="#8b949e" font-size="8">Receives API key + gateway URLs via Budget Help</text>

<!-- ═══════════════════════════════════════════
     ARROW: user → gateway (uses the key)
     ═══════════════════════════════════════════ -->
<path d="M634,455 L634,510" fill="none" stroke="#d29922" stroke-width="2" marker-end="url(#ah-amber)"/>

<!-- step label -->
<rect x="565" y="474" width="16" height="16" rx="8" fill="#d29922"/>
<text x="573" y="485" text-anchor="middle" fill="#0d1117" font-size="9" font-weight="700">6</text>
<text x="587" y="485" fill="#d29922" font-size="9" font-weight="600">Engineer uses key to access gateway</text>

<!-- ═══════════════════════════════════════════
     GATEWAY (Praxis) — usage
     ═══════════════════════════════════════════ -->
<rect x="462" y="515" width="345" height="60" rx="8" fill="#2a1f0d" stroke="#d29922" stroke-width="2" filter="url(#shadow)"/>
<text x="634" y="535" text-anchor="middle" fill="#d29922" font-size="9" font-weight="600">AI GATEWAY</text>
<text x="634" y="550" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">Praxis Proxy</text>
<text x="634" y="565" text-anchor="middle" fill="#8b949e" font-size="8">api_key_auth validates key → routes to model providers</text>

<!-- usage example -->
<rect x="830" y="400" width="230" height="88" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="945" y="414" text-anchor="middle" fill="#6e7681" font-size="8" font-weight="600">DELIVERED BY BUDGET HELP (static)</text>
<text x="845" y="428" fill="#d29922" font-size="7" font-weight="600">Anthropic (Claude Code):</text>
<text x="845" y="439" fill="#8b949e" font-size="7" class="mono">ANTHROPIC_API_KEY=sk-oai-abc123...</text>
<text x="845" y="450" fill="#8b949e" font-size="7" class="mono">ANTHROPIC_BASE_URL=https://ai-gateway</text>
<text x="845" y="460" fill="#8b949e" font-size="7" class="mono">  .example.com/anthropic</text>
<text x="845" y="474" fill="#d29922" font-size="7" font-weight="600">OpenAI (Codex CLI):</text>
<text x="845" y="485" fill="#8b949e" font-size="7" class="mono">OPENAI_BASE_URL=https://ai-gateway</text>
<text x="845" y="495" fill="#8b949e" font-size="7" class="mono">  .example.com/openai</text>

<path d="M830,455 L807,445" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

<!-- ═══════════════════════════════════════════
     VALIDATION FLOW (gateway → maas-api)
     ═══════════════════════════════════════════ -->
<path d="M462,565 L440,565 L440,585 L45,585 L45,195 L58,195" fill="none" stroke="#bc8cff" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ah-purple)"/>
<text x="45" y="400" fill="#bc8cff" font-size="7" transform="rotate(-90,45,400)">api_key_auth → POST /internal/v1/api-keys/validate</text>

<!-- ═══════════════════════════════════════════
     FLOW SUMMARY
     ═══════════════════════════════════════════ -->
<rect x="60" y="390" width="340" height="185" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="230" y="410" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="600">Onboarding Flow Summary</text>

<text x="76" y="430" fill="#8957e5" font-size="8" font-weight="600">1</text>
<text x="90" y="430" fill="#8b949e" font-size="8">AI Budget Help approves team budget</text>

<text x="76" y="446" fill="#58a6ff" font-size="8" font-weight="600">2</text>
<text x="90" y="446" fill="#8b949e" font-size="8">POST /v1/api-keys with offline token + identity headers</text>

<text x="76" y="462" fill="#39d2c0" font-size="8" font-weight="600">3</text>
<text x="90" y="462" fill="#8b949e" font-size="8">maas-api hashes key, stores in PostgreSQL</text>

<text x="76" y="478" fill="#3fb950" font-size="8" font-weight="600">4</text>
<text x="90" y="478" fill="#8b949e" font-size="8">HTTP 201 returns plaintext key (shown once)</text>

<text x="76" y="494" fill="#d29922" font-size="8" font-weight="600">5</text>
<text x="90" y="494" fill="#8b949e" font-size="8">Key + static gateway URLs delivered via Budget Help</text>

<text x="76" y="510" fill="#d29922" font-size="8" font-weight="600">6</text>
<text x="90" y="510" fill="#8b949e" font-size="8">Engineer sets ANTHROPIC_API_KEY, uses gateway</text>

<text x="76" y="534" fill="#bc8cff" font-size="8" font-weight="600">✓</text>
<text x="90" y="534" fill="#8b949e" font-size="8">Each request: Praxis validates key via maas-api</text>
<text x="90" y="546" fill="#8b949e" font-size="8">internal endpoint, resolves user + group identity</text>

<text x="76" y="566" fill="#6e7681" font-size="8" font-weight="600">⚠</text>
<text x="90" y="566" fill="#6e7681" font-size="8">Auth: offline token (interim) + NetworkPolicy</text>
<text x="90" y="578" fill="#6e7681" font-size="8">restricts access to maas-api from Budget Help only</text>

<!-- ═══════════════════════════════════════════
     LEGEND
     ═══════════════════════════════════════════ -->
<g transform="translate(60, 610)">
  <text x="0" y="12" fill="#8b949e" font-size="9" font-weight="600">LEGEND</text>
  <line x1="55" y1="8" x2="80" y2="8" stroke="#8957e5" stroke-width="2"/>
  <text x="85" y="12" fill="#8b949e" font-size="8">External service</text>
  <line x1="185" y1="8" x2="210" y2="8" stroke="#58a6ff" stroke-width="2"/>
  <text x="215" y="12" fill="#8b949e" font-size="8">API call</text>
  <line x1="265" y1="8" x2="290" y2="8" stroke="#3fb950" stroke-width="2"/>
  <text x="295" y="12" fill="#8b949e" font-size="8">Response</text>
  <line x1="355" y1="8" x2="380" y2="8" stroke="#39d2c0" stroke-width="2"/>
  <text x="385" y="12" fill="#8b949e" font-size="8">Database</text>
  <line x1="445" y1="8" x2="470" y2="8" stroke="#d29922" stroke-width="2"/>
  <text x="475" y="12" fill="#8b949e" font-size="8">User flow</text>
  <line x1="535" y1="8" x2="560" y2="8" stroke="#bc8cff" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="565" y="12" fill="#8b949e" font-size="8">Runtime validation</text>
</g>

</svg>
</div>
</body>
</html>
